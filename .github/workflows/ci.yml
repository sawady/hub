name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Term scan (list comes from a repository secret, never from the repo)
        env:
          HUB_LEAK_TERMS: ${{ secrets.HUB_LEAK_TERMS }}
        run: |
          if [ -z "$HUB_LEAK_TERMS" ]; then
            echo "::warning::HUB_LEAK_TERMS secret not set (or a fork PR); term scan skipped"
            exit 0
          fi
          scripts/check-leaks.sh --history
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck bats
          git config --global user.email ci@example.com && git config --global user.name ci
          git config --global init.defaultBranch main
      - name: shellcheck
        run: shellcheck bin/hub scripts/*.sh plugin/scripts/*.sh tests/fakes/*
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: bats
        run: bats tests/
      - name: JSON files parse
        run: for f in .claude-plugin/*.json plugin/.claude-plugin/*.json plugin/hooks/*.json plugin/template/.claude/settings.json; do jq empty "$f"; done
